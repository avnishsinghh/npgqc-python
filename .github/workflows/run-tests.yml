name: "Unit tests"

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l -e -o pipefail {0}

    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: "admin"
          MYSQL_DATABASE: "npgqctest"
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: set timezone
      run: |
        sudo timedatectl set-timezone Europe/London
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"
    - name: Format check
      run: |
        ruff check
    - name: Database Environment
      run: |
        echo "set global sql_mode = 'STRICT_TRANS_TABLES'" | mysql -h 127.0.0.1 -Dnpgqctest -P3306 -u root -padmin
    - name: Test
      run: |
        export NPGQC_TEST_DB_URL="mysql+pymysql://root:admin@127.0.0.1:3306/npgqctest"
        pytest -v --it
